# Machine-local paths for the current source-migration layout. Defaults are
# relative to this repository; external installations and datasets are supplied
# only through environment variables. No private-server absolute path is part
# of the public default.

schema: avengine_workspace_paths_v2
version: 2
trust_mode: trusted_research_workspace

paths:
  AVENGINE_REPOSITORY_ROOT:
    default: .
    kind: directory
    required_for: [fast_unit]
  AVENGINE_HABITAT_RUNTIME_ROOT:
    # Transitional sibling source root; remove or repoint inside this repository
    # only when the selected Habitat/RLR source has landed and passed cutover.
    default: ../habitat-sim-AVEngine
    kind: directory
    required_for: [native_habitat, rlr_audio, release_canary]
  AVENGINE_EVIDENCE_ROOT:
    default: tmp
    kind: output_directory
    required_for: [release_canary]
  AVENGINE_REPLICACAD_ROOT:
    default: null
    kind: directory
    required_for: [replicacad_room]
  AVENGINE_MP3D_ROOT:
    default: null
    kind: directory
    required_for: [mp3d_room]
  AVENGINE_LEGACY_APARTMENT_ROOT:
    # Compatibility name for an external Apartment data/project root. Apartment
    # production pixels use UE/SPEAR; the asset root itself never moves into Git.
    default: null
    kind: directory
    required_for: [legacy_room]

workspace_root_entries:
  - AVENGINE_REPOSITORY_ROOT
  - AVENGINE_HABITAT_RUNTIME_ROOT
  - AVENGINE_EVIDENCE_ROOT
  - AVENGINE_REPLICACAD_ROOT
  - AVENGINE_MP3D_ROOT
  - AVENGINE_LEGACY_APARTMENT_ROOT

optional_backends:
  # Optional here means not loaded by fast bootstrap. It does not turn the
  # Apartment/Kujiale UE production visual routes into comparison backends.
  enabled_by_default: false
  documentation: docs/legacy/OPTIONAL_BACKENDS.md
