<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>进度看板 · AVEngine Studio</title>
<style>
:root{--bg:#fbfaf7;--ink:#2c2c2a;--mut:#8a877d;--line:#e2dfd6;
--ok:#1f6b4a;--okbg:#e1f5ee;--bad:#a33;--badbg:#fae7e7;--none:#f1efe8}
*{box-sizing:border-box}
body{font-family:system-ui,'PingFang SC',sans-serif;margin:0;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
padding:.7rem 1.2rem;display:flex;gap:.9rem;align-items:center;flex-wrap:wrap}
header h1{font-size:1.05rem;margin:0 1rem 0 0}
header a{color:#534ab7;text-decoration:none;font-size:.85rem}
input[type=search]{font:inherit;font-size:.85rem;padding:.25rem .45rem;border:1px solid var(--line);border-radius:5px}
#note{font-size:.76rem;color:var(--mut);padding:.5rem 1.2rem 0}
.wrap{padding: .6rem 1.2rem 2rem;overflow-x:auto}
table{border-collapse:collapse;font-size:.8rem;min-width:60rem;width:100%}
th,td{border:1px solid var(--line);padding:.4rem .55rem;vertical-align:top;text-align:left}
th{background:#f4f2ec;font-size:.74rem;white-space:nowrap}
td.scene{font-family:ui-monospace,monospace;font-size:.78rem;white-space:nowrap}
.cell{border-radius:4px;padding:.25rem .4rem}
.cell.ok{background:var(--okbg)}
.cell.bad{background:var(--badbg)}
.cell a{color:inherit;text-decoration:none;display:block}
.cell .sum{font-size:.74rem}
.cell .who{font-size:.68rem;color:var(--mut);font-family:ui-monospace,monospace}
.empty{color:#c9c5b8;text-align:center}
#stats{font-size:.8rem;color:var(--mut);margin-left:auto}
</style></head><body>
<header>
  <h1>进度看板</h1>
  <a href="/">← 首页</a>
  <a href="/studio/review">验收台 →</a>
  <input type="search" id="fText" placeholder="过滤场景 id">
  <span id="stats"></span>
</header>
<div id="note"></div>
<div class="wrap"><table id="board"><thead></thead><tbody></tbody></table></div>
<script>
const STAGE_LABELS = {room: '① 房间清单', package: '② 声学包', routes: '③ 轨迹库',
                      episode: '④ 成品 episode', verdict: '⑤ 人工验收'};
let data = null;

function cellHTML(cell){
  if (!cell) return '<div class="empty">—</div>';
  const cls = cell.ok ? 'ok' : 'bad';
  return `<div class="cell ${cls}">
    <a href="/api/tasks/${cell.task_id}/log?tail=200" target="_blank" rel="noopener">
      <div class="sum">${cell.ok ? '✓' : '✗'} ${cell.summary || ''}</div>
      <div class="who">${cell.task_id || ''}</div>
    </a></div>`;
}

function paint(){
  if (!data) return;
  const text = fText.value.trim().toLowerCase();
  const head = document.querySelector('#board thead');
  const body = document.querySelector('#board tbody');
  head.innerHTML = '<tr><th>场景</th>' +
    data.stages.map(s => `<th>${STAGE_LABELS[s] || s}</th>`).join('') + '</tr>';
  const rows = data.rows.filter(r => !text || r.scene.toLowerCase().includes(text));
  body.innerHTML = rows.map(r =>
    `<tr><td class="scene">${r.scene}</td>` +
    data.stages.map(s => `<td>${cellHTML(r.cells[s])}</td>`).join('') + '</tr>'
  ).join('') || '<tr><td colspan="6" class="empty">还没有可入板的任务产物</td></tr>';
  const done = rows.filter(r => data.stages.every(s => r.cells[s] && r.cells[s].ok)).length;
  stats.textContent = `${rows.length} 个场景在板上 · ${done} 个五步全绿 · 15 秒自动刷新`;
  document.getElementById('note').textContent = data.note || '';
}

async function refresh(){
  data = await (await fetch('/api/board')).json();
  paint();
}
fText.addEventListener('input', paint);
refresh(); setInterval(refresh, 15000);
</script></body></html>
