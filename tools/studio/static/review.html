<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>验收台 · AVEngine Studio</title>
<style>
:root{--bg:#fbfaf7;--card:#fff;--ink:#2c2c2a;--mut:#8a877d;--line:#e2dfd6;
--ok:#1f6b4a;--okbg:#e1f5ee;--warn:#9a6b12;--warnbg:#fdf3d8;--bad:#a33;--badbg:#fae7e7}
*{box-sizing:border-box}
body{font-family:system-ui,'PingFang SC',sans-serif;margin:0;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
padding:.7rem 1.2rem;display:flex;gap:.9rem;align-items:center;flex-wrap:wrap}
header h1{font-size:1.05rem;margin:0 1rem 0 0}
header a{color:#534ab7;text-decoration:none;font-size:.85rem}
#hint{font-size:.76rem;color:var(--mut);padding:.5rem 1.2rem 0;max-width:60rem}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:16px;padding:16px}
.ep{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ep video{width:100%;display:block;background:#000;aspect-ratio:16/9}
.media{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line)}
.media .pane{background:var(--card);display:flex;flex-direction:column}
.media .pane .lab{font-size:.68rem;color:var(--mut);padding:.2rem .45rem}
.media img{width:100%;display:block;background:#f4f2ec;aspect-ratio:16/9;object-fit:contain}
.body{padding:.6rem .8rem .8rem;display:flex;flex-direction:column;gap:.45rem;font-size:.8rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.name{font-weight:600;font-family:ui-monospace,monospace;font-size:.74rem;word-break:break-all;color:var(--mut)}
.chip{padding:.06rem .4rem;border-radius:3px;font-size:.72rem;background:#efede6}
.verdict{padding:.12rem .6rem;border-radius:4px;font-size:.82rem;font-weight:600}
.verdict.pass{background:var(--okbg);color:var(--ok)}
.verdict.fail{background:var(--badbg);color:var(--bad)}
.verdict.none{background:var(--warnbg);color:var(--warn)}
.failwhy{background:var(--badbg);border-radius:4px;padding:.3rem .5rem;font-size:.76rem;line-height:1.5}
ul.checks{margin:.1rem 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.22rem}
ul.checks li{font-size:.74rem;line-height:1.45;display:flex;gap:.4rem}
ul.checks .mark{flex:none;width:1.05rem;text-align:center;font-weight:700}
ul.checks li.pass .mark{color:var(--ok)}
ul.checks li.fail .mark{color:var(--bad)}
ul.checks li.info .mark{color:var(--mut)}
.strip{width:100%;height:22px;display:block;background:#f4f2ec;border-radius:4px}
audio{width:100%;height:30px}
details{border:1px solid var(--line);border-radius:6px;padding:.35rem .55rem;background:#faf9f5}
details summary{cursor:pointer;font-size:.74rem;color:var(--mut)}
details[open] summary{margin-bottom:.4rem}
.buttons{display:flex;gap:.4rem;align-items:center}
.buttons button{font:inherit;font-size:.72rem;padding:.2rem .55rem;border-radius:5px;border:1px solid var(--line);
background:#fff;cursor:pointer;color:var(--mut)}
button.pass.on{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
button.fail.on{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
button.unsure.on{background:var(--warnbg);color:var(--warn)}
input.note{flex:1;font:inherit;font-size:.72rem;padding:.2rem .5rem;border:1px solid var(--line);border-radius:5px}
.saved{font-size:.7rem;color:var(--mut)}
.mutlabel{font-size:.7rem;color:var(--mut)}
</style></head><body>
<header>
  <h1>验收台</h1>
  <a href="/">← 首页</a>
  <a href="/studio/board">看板 →</a>
  <span id="count" style="font-size:.8rem;color:var(--mut)"></span>
</header>
<div id="hint">你要看的只有两样：<b>成片</b>（点播放才加载）和它走的<b>轨迹图</b>。对错由机器判，
章就盖在图旁边——绿的不用管，红的才附一句为什么。数字、检查项、试听等技术细节都折在"细节"里，是给同学排查用的，你不用点。</div>
<div id="list"></div>
<script>
function art(taskId, rel){ return `/api/tasks/${taskId}/artifact?path=${encodeURIComponent(rel)}`; }

function strip(canvas, errors){
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.clientWidth * devicePixelRatio;
  const h = canvas.height = canvas.clientHeight * devicePixelRatio;
  if (!errors || !errors.length) return;
  const bar = w / errors.length;
  errors.forEach((e, i) => {
    ctx.fillStyle = e == null ? '#ddd' : Math.abs(e) <= 5 ? '#59b389' : Math.abs(e) <= 15 ? '#e3c15e' : '#d97b70';
    ctx.fillRect(i * bar, 0, Math.ceil(bar), h);
  });
}

function verdictChip(ep){
  const audition = ep.machine_audition;
  if (!audition) return '<span class="verdict none">旧任务 · 未经机器听审（重跑一次④即有）</span>';
  return audition.verdict === 'pass'
    ? '<span class="verdict pass">机器判定 ✓ 通过</span>'
    : '<span class="verdict fail">机器判定 ✗ 不过</span>';
}

async function submitVerdict(ep, verdict, note, el){
  const response = await fetch(`/api/tasks/${ep.task_id}/verdict`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({verdict, note}),
  });
  const payload = await response.json();
  const saved = el.querySelector('.saved');
  if (payload.error) { saved.textContent = '写入失败: ' + payload.error; return; }
  for (const b of el.querySelectorAll('.buttons button')) b.classList.remove('on');
  el.querySelector('button.' + verdict).classList.add('on');
  saved.textContent = `已记录人工覆核 ${payload.verdict.verdict} @ ${payload.verdict.written_at}`;
}

function episodeCard(ep){
  const el = document.createElement('div'); el.className = 'ep';
  const a = ep.artifacts || {};
  const audition = ep.machine_audition;
  const existing = ep.verdict;
  const marks = {pass: '✓', fail: '✗', info: '·'};
  const failReasons = audition && audition.verdict !== 'pass'
    ? (audition.checks || []).filter(c => c.status === 'fail')
        .map(c => `<div class="failwhy">✗ ${c.reason_zh || c.name}</div>`).join('')
    : '';
  const allChecks = audition
    ? `<ul class="checks">${(audition.checks || []).map(c =>
        `<li class="${c.status}"><span class="mark">${marks[c.status] || '?'}</span><span>${c.reason_zh || c.name}</span></li>`
      ).join('')}</ul>`
    : '<div class="mutlabel">无机器听审档。</div>';
  el.innerHTML = `
    ${a.mp4 ? `<video controls preload="none" ${a.first_frame ? `poster="${art(ep.task_id, a.first_frame)}"` : ''} src="${art(ep.task_id, a.mp4)}"></video>` : ''}
    ${ep.route_map ? `<div class="media"><div class="pane"><div class="lab">它走的轨迹（同楼层俯视图）</div>
      <img loading="lazy" src="${art(ep.route_map.task_id, ep.route_map.path)}" alt="轨迹图"></div>
      <div class="pane"><div class="lab">第一帧</div>
      ${a.first_frame ? `<img loading="lazy" src="${art(ep.task_id, a.first_frame)}" alt="首帧">` : ''}</div></div>` : ''}
    <div class="body">
      <div class="row">${verdictChip(ep)}
        <span class="chip">${ep.scene_id || '?'}</span></div>
      ${failReasons}
      <div class="name">${ep.task_id}</div>
      <details><summary>细节（同学/排查用：全部检查项、逐帧色带、试听）</summary>
        ${allChecks}
        <canvas class="strip" title="逐帧方向误差（绿 ≤5°，黄 ≤15°，红更大）" style="margin-top:.4rem"></canvas>
        ${a.foa_stereo_fold ? `<div class="mutlabel" style="margin-top:.3rem">FOA 简易立体声折叠（训练格式的试听替身；视频里的是 HRTF 双耳）</div>
          <audio controls preload="none" src="${art(ep.task_id, a.foa_stereo_fold)}"></audio>` : ''}
        ${audition && audition.scope_note_zh ? `<div class="mutlabel" style="margin-top:.3rem">${audition.scope_note_zh}</div>` : ''}
        <div class="mutlabel" style="margin-top:.4rem">人工覆核（只在不同意机器结论时用）：</div>
        <div class="buttons" style="margin-top:.25rem">
          <button class="pass ${existing && existing.verdict==='pass' ? 'on':''}">✓ 判通过</button>
          <button class="fail ${existing && existing.verdict==='fail' ? 'on':''}">✗ 判不过</button>
          <button class="unsure ${existing && existing.verdict==='unsure' ? 'on':''}">? 存疑</button>
          <input class="note" placeholder="一句理由" value="${existing && existing.note ? existing.note.replace(/"/g,'&quot;') : ''}">
        </div>
        <div class="saved">${existing ? `已记录人工覆核 ${existing.verdict} @ ${existing.written_at}` : '无人工覆核（机器结论即最终结论）'}</div>
      </details>
    </div>`;
  const note = () => el.querySelector('input.note').value;
  el.querySelector('button.pass').onclick = () => submitVerdict(ep, 'pass', note(), el);
  el.querySelector('button.fail').onclick = () => submitVerdict(ep, 'fail', note(), el);
  el.querySelector('button.unsure').onclick = () => submitVerdict(ep, 'unsure', note(), el);
  const canvas = el.querySelector('canvas');
  el.querySelector('details').addEventListener('toggle', function(){
    if (this.open) strip(canvas, ep.error_deg_per_frame);
  });
  return el;
}

async function boot(){
  const payload = await (await fetch('/api/review-queue')).json();
  const list = document.getElementById('list');
  if (payload.error) { list.textContent = payload.error; return; }
  const episodes = payload.episodes || [];
  const machinePass = episodes.filter(e => e.machine_audition && e.machine_audition.verdict === 'pass').length;
  const machineFail = episodes.filter(e => e.machine_audition && e.machine_audition.verdict !== 'pass').length;
  document.getElementById('count').textContent =
    `${episodes.length} 条成片 · 机器判过 ${machinePass} · 判不过 ${machineFail}`;
  for (const ep of episodes) list.appendChild(episodeCard(ep));
  if (!episodes.length) list.textContent = '队列为空：跑一个 hm3d_episode 任务它就会出现在这里。';
}
boot();
</script></body></html>
