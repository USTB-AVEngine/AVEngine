<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音视频验收台 · AVEngine Studio</title>
<style>
:root{--bg:#fbfaf7;--card:#fff;--ink:#2c2c2a;--mut:#8a877d;--line:#e2dfd6;
--ok:#1f6b4a;--okbg:#e1f5ee;--warn:#9a6b12;--warnbg:#fdf3d8;--bad:#a33;--badbg:#fae7e7}
*{box-sizing:border-box}
body{font-family:system-ui,'PingFang SC',sans-serif;margin:0;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
padding:.7rem 1.2rem;display:flex;gap:.9rem;align-items:center;flex-wrap:wrap}
header h1{font-size:1.05rem;margin:0 1rem 0 0}
header a{color:#534ab7;text-decoration:none;font-size:.85rem}
#hint{font-size:.76rem;color:var(--mut);padding:.5rem 1.2rem 0;max-width:60rem}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:16px;padding:16px}
.ep{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ep video{width:100%;display:block;background:#000;aspect-ratio:16/9}
.body{padding:.6rem .8rem .8rem;display:flex;flex-direction:column;gap:.45rem;font-size:.8rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.name{font-weight:600;font-family:ui-monospace,monospace;font-size:.76rem;word-break:break-all}
.chip{padding:.06rem .4rem;border-radius:3px;font-size:.72rem;background:#efede6}
.strip{width:100%;height:34px;display:block;background:#f4f2ec;border-radius:4px}
audio{width:100%;height:30px}
.buttons{display:flex;gap:.5rem;align-items:center}
button{font:inherit;font-size:.82rem;padding:.32rem .8rem;border-radius:6px;border:1px solid var(--line);
background:#fff;cursor:pointer}
button.pass{border-color:var(--ok)} button.pass.on{background:var(--okbg)}
button.fail{border-color:var(--bad)} button.fail.on{background:var(--badbg)}
button.unsure.on{background:var(--warnbg)}
input.note{flex:1;font:inherit;font-size:.78rem;padding:.28rem .5rem;border:1px solid var(--line);border-radius:5px}
.saved{font-size:.72rem;color:var(--mut)}
.mutlabel{font-size:.7rem;color:var(--mut)}
</style></head><body>
<header>
  <h1>音视频验收台</h1>
  <a href="/">← 首页</a>
  <a href="/studio/board">看板 →</a>
  <span id="count" style="font-size:.8rem;color:var(--mut)"></span>
</header>
<div id="hint">遮挡不是缺陷：声源允许出画、允许被挡，那正是要保留的样本。要判的是常识层面的对错 ——
声音方位跟画面/轨迹对不对、有没有破音卡顿、混响像不像这间屋。判定写回该任务目录，看板第 ⑤ 列即时更新。
时间轴色带是逐帧方向误差（绿 ≤5°，黄 ≤15°，红更大）。</div>
<div id="list"></div>
<script>
function art(taskId, rel){ return `/api/tasks/${taskId}/artifact?path=${encodeURIComponent(rel)}`; }

function strip(canvas, errors){
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.clientWidth * devicePixelRatio;
  const h = canvas.height = canvas.clientHeight * devicePixelRatio;
  if (!errors || !errors.length) return;
  const bar = w / errors.length;
  errors.forEach((e, i) => {
    ctx.fillStyle = e == null ? '#ddd' : Math.abs(e) <= 5 ? '#59b389' : Math.abs(e) <= 15 ? '#e3c15e' : '#d97b70';
    ctx.fillRect(i * bar, 0, Math.ceil(bar), h);
  });
}

function chipRow(ep){
  const err = ep.direction_error_deg || {};
  const reverb = ep.reverberation || {};
  return [
    `<span class="chip">${ep.scene_id || '?'}</span>`,
    `<span class="chip">${ep.motion_case || ''}</span>`,
    `<span class="chip">帧 ${ep.frames_within_tolerance ?? '?'} / ${ep.frames_rendered ?? '?'} 达容差</span>`,
    err.median != null ? `<span class="chip">误差中位 ${err.median}° · p90 ${err.p90}°</span>` : '',
    reverb.t20_ms_median != null ? `<span class="chip">T20 中位 ${Math.round(reverb.t20_ms_median)} ms</span>` : '',
  ].join('');
}

async function submitVerdict(ep, verdict, note, el){
  const response = await fetch(`/api/tasks/${ep.task_id}/verdict`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({verdict, note}),
  });
  const payload = await response.json();
  const saved = el.querySelector('.saved');
  if (payload.error) { saved.textContent = '写入失败: ' + payload.error; return; }
  for (const b of el.querySelectorAll('button')) b.classList.remove('on');
  el.querySelector('button.' + verdict).classList.add('on');
  saved.textContent = `已记录 ${payload.verdict.verdict} @ ${payload.verdict.written_at}`;
}

function episodeCard(ep){
  const el = document.createElement('div'); el.className = 'ep';
  const a = ep.artifacts || {};
  const poster = a.first_frame ? `poster="${art(ep.task_id, a.first_frame)}"` : '';
  const existing = ep.verdict;
  el.innerHTML = `
    ${a.mp4 ? `<video controls preload="none" ${poster} src="${art(ep.task_id, a.mp4)}"></video>` : ''}
    <div class="body">
      <div class="name">${ep.task_id}</div>
      <div class="row">${chipRow(ep)}</div>
      <canvas class="strip" title="逐帧方向误差"></canvas>
      ${a.foa_stereo_fold ? `<div class="mutlabel">FOA 简易立体声折叠（训练格式的试听替身；上面视频里的是 HRTF 双耳）</div>
        <audio controls preload="none" src="${art(ep.task_id, a.foa_stereo_fold)}"></audio>` : ''}
      <div class="buttons">
        <button class="pass ${existing && existing.verdict==='pass' ? 'on':''}">✓ 看着对</button>
        <button class="fail ${existing && existing.verdict==='fail' ? 'on':''}">✗ 不对</button>
        <button class="unsure ${existing && existing.verdict==='unsure' ? 'on':''}">? 说不清</button>
        <input class="note" placeholder="一句备注（可选）" value="${existing && existing.note ? existing.note.replace(/"/g,'&quot;') : ''}">
      </div>
      <div class="saved">${existing ? `已记录 ${existing.verdict} @ ${existing.written_at}` : '未验收'}</div>
    </div>`;
  const note = () => el.querySelector('input.note').value;
  el.querySelector('button.pass').onclick = () => submitVerdict(ep, 'pass', note(), el);
  el.querySelector('button.fail').onclick = () => submitVerdict(ep, 'fail', note(), el);
  el.querySelector('button.unsure').onclick = () => submitVerdict(ep, 'unsure', note(), el);
  requestAnimationFrame(() => strip(el.querySelector('canvas'), ep.error_deg_per_frame));
  return el;
}

async function boot(){
  const payload = await (await fetch('/api/review-queue')).json();
  const list = document.getElementById('list');
  if (payload.error) { list.textContent = payload.error; return; }
  const episodes = payload.episodes || [];
  document.getElementById('count').textContent =
    `${episodes.length} 条 episode · ${episodes.filter(e => e.verdict).length} 条已验收`;
  for (const ep of episodes) list.appendChild(episodeCard(ep));
  if (!episodes.length) list.textContent = '队列为空：跑一个 hm3d_episode 任务它就会出现在这里。';
}
boot();
</script></body></html>
