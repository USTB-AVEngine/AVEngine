<!doctype html><html lang="zh"><meta charset="utf-8"><title>规范选房人工审核</title>
<style>body{font:16px sans-serif;max-width:1400px;margin:24px auto;background:#f5f5f5}button,select,input,textarea{font:inherit;margin:6px;padding:6px}img,video{max-width:48%;max-height:620px;vertical-align:top}pre{white-space:pre-wrap}textarea{width:90%}</style>
<h1>房间独立人工审核</h1><p>判断在浏览器中暂存并导出独立 JSON。第二审核人先独立看图与视频，再合议分歧。</p>
<label>审核人 <input id="author" placeholder="填写姓名"></label><label>角色 <select id="role"><option value="first">第一审核 / 复核</option><option value="second">第二审核人（固定样本、隐藏建议）</option></select></label>
<button id="prev">上一间</button><button id="next">下一间</button><button id="export">导出判断</button>
<h2 id="title"></h2><div id="media"></div><details id="suggestions"><summary>自动建议及指标</summary><pre id="info"></pre></details>
<label>判断 <select id="verdict"><option value="">未判断</option><option value="use">use 用</option><option value="skip">skip 不用</option><option value="unsure">unsure 存疑</option></select></label>
<div id="reasons"></div><textarea id="note" rows="3" placeholder="边界、切分修正或其他原因的说明"></textarea><p id="status"></p>
<script>
let queue=[],codes={},subset=[],index=0,decisions={};const $=id=>document.getElementById(id);
const key=r=>r.house+'/'+r.room_label;
function save(){if(!subset.length)return;let r=subset[index],k=$('role').value+':'+key(r);decisions[k]={house:r.house,room_label:r.room_label,role:$('role').value,reviewer:$('author').value,verdict:$('verdict').value||null,reason_codes:[...document.querySelectorAll('#reasons input:checked')].map(x=>x.value),note:$('note').value,written_at:new Date().toISOString()};localStorage.setItem('room_selection_review_v1',JSON.stringify(decisions));}
function show(){let r=subset[index];if(!r){$('title').textContent='没有可审核样本';return;}$('title').textContent=`${index+1}/${subset.length} ${key(r)}`;$('media').replaceChildren();
if(r.overhead_path){let im=document.createElement('img');im.src=r.overhead_path;$('media').append(im);}if(r.video_url){let v=document.createElement('video');v.src=r.video_url;v.controls=true;v.preload='metadata';$('media').append(v);}
$('suggestions').hidden=$('role').value==='second';$('info').textContent=JSON.stringify({automatic:r.automatic,split:r.split,gate:r.gate,metrics:r.floor_metrics,split_parts:r.split_parts},null,2);
if($('role').value==='first')for(let p of r.split_overlay_paths){let im=document.createElement('img');im.src=p;$('media').append(im);}
let old=decisions[$('role').value+':'+key(r)]||{};$('verdict').value=old.verdict||'';$('note').value=old.note||'';for(let el of document.querySelectorAll('#reasons input'))el.checked=(old.reason_codes||[]).includes(el.value);$('status').textContent=`原 region 登记；本轮状态 ${r.review_status}。`;
}
(async()=>{queue=(await(await fetch('review_queue.jsonl')).text()).trim().split('\n').filter(Boolean).map(x=>JSON.parse(x));codes=await(await fetch('review_reason_codes.json')).json();try{decisions=JSON.parse(localStorage.getItem('room_selection_review_v1')||'{}');}catch(e){}for(let [code,name] of Object.entries(codes)){let label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.value=code;label.append(check,document.createTextNode(name));$('reasons').append(label);}subset=queue;show();})();
$('prev').onclick=()=>{save();index=Math.max(0,index-1);show();};$('next').onclick=()=>{save();index=Math.min(subset.length-1,index+1);show();};$('role').onchange=()=>{subset=queue.filter(r=>$('role').value==='first'||r.second_review);index=0;show();};
$('export').onclick=()=>{save();const judged=Object.values(decisions).filter(r=>r.role===$('role').value&&r.verdict);if(!judged.length){alert('没有已判断条目');return;}if(judged.some(r=>!r.reviewer||((r.verdict!=='use'||r.reason_codes.includes('OTHER'))&&!r.reason_codes.length)||r.reason_codes.includes('OTHER')&&!r.note)){alert('请填写审核人、skip/unsure 理由及其他理由说明');return;}let blob=new Blob([JSON.stringify({schema:'room_selection_independent_reviews_v1',role:$('role').value,records:judged},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='room_selection_'+$('role').value+'_'+new Date().toISOString().replaceAll(':','-')+'.json';a.click();URL.revokeObjectURL(a.href);};
</script></html>
