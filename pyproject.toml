[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avengine"
version = "0.1.0a1"
description = "Deterministic Habitat-native audiovisual dataset engine"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.18",
  "numpy>=1.24",
  "Pillow>=9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
avengine = "avengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/avengine/schemas" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires the pinned Habitat runtime and local scene assets",
  "canary: produces executable milestone evidence",
]
