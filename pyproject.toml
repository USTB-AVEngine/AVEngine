[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avengine"
version = "0.1.0a1"
description = "Deterministic Habitat-native audiovisual dataset engine"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.18",
  "numpy>=1.24",
  "Pillow>=9",
  "PyYAML>=6",
  "psutil>=5.9",
  "yacs>=0.1.8",
]

[project.optional-dependencies]
rlr = ["sofar>=1.2.3"]
native = [
  "soundfile>=0.12",
  "numpy-quaternion>=2022.4",
  "sofar>=1.2.3",
  "attrs>=22",
  "imageio>=2.31",
  "imageio-ffmpeg>=0.4",
  "scipy>=1.10",
  "numba>=0.57",
  "tqdm>=4.64",
  "GitPython>=3.1",
]
test = ["pytest>=8"]

[project.scripts]
avengine = "avengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"avengine.backends.spear_ue" = ["capture_defaults.json"]
"avengine.backends.spear_ue.client" = ["config/*.yaml"]

[tool.setuptools.data-files]
"share/avengine/schemas" = ["schemas/*.json"]
"share/avengine/runtime_profiles" = ["examples/runtime/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires the pinned Habitat runtime and local scene assets",
  "canary: produces executable milestone evidence",
  "fast_unit: hermetic Python contract or algorithm test",
  "slow_hermetic: larger local fixture test without native simulation",
  "native_habitat: requires the pinned Habitat runtime and scene assets",
  "rlr_audio: requires the native RLR audio backend",
  "blender_assets: requires Blender or Blender-produced asset validation",
  "media_readback: requires audio/video codecs and artifact readback",
  "release_canary: verifies a cross-repository release evidence bundle",
]
