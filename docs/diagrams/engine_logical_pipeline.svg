<rect x="446" y="217" width="180" height="64" rx="4" fill="#EEEDFE" stroke="#534AB7"/><text x="536" y="243" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle">M6 AudioProgram</text><text x="536" y="263" font-size="12" fill="#534AB7" text-anchor="middle">轮流发声事件调度</text>
