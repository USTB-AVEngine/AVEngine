<rect x="285" y="80" width="110" height="64" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="340" y="106" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">RLR SDK</text><text x="340" y="126" font-size="12" fill="#5F5E5A" text-anchor="middle">真实声线追踪</text>
<rect x="405" y="80" width="110" height="64" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="460" y="106" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">运行时前缀</text><text x="460" y="126" font-size="12" fill="#5F5E5A" text-anchor="middle">installed 链</text>
