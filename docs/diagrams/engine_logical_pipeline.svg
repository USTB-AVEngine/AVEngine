<rect x="346" y="352" width="135" height="64" rx="4" fill="#E1F5EE" stroke="#0F6E56"/><text x="413" y="378" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">M3 声学编译</text><text x="413" y="398" font-size="12" fill="#0F6E56" text-anchor="middle">网格 + 材质库</text>
