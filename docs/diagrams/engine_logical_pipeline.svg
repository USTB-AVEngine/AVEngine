<rect x="0" y="0" width="680" height="700" fill="#FFFFFF"/>
<g font-family="'PingFang SC','Noto Sans CJK SC',sans-serif">
<rect x="40" y="50" width="600" height="112" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="52" y="70" font-size="12" fill="#5F5E5A">外置运行时输入（不进 Git，clone 后自装）</text>
<g>
