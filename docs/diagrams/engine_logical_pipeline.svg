<rect x="250" y="487" width="180" height="64" rx="4" fill="#FAECE7" stroke="#993C1D"/><text x="340" y="513" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">音画合成</text><text x="340" y="533" font-size="12" fill="#993C1D" text-anchor="middle">冻结 mux 契约</text>
<rect x="446" y="487" width="180" height="64" rx="4" fill="#FAECE7" stroke="#993C1D"/><text x="536" y="513" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">QA 出题</text><text x="536" y="533" font-size="12" fill="#993C1D" text-anchor="middle">QuestionSpec 判定</text>
</g>
<line x1="340" y1="567" x2="340" y2="586" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="592" width="560" height="64" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="340" y="618" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">Episode 产物包</text><text x="340" y="638" font-size="12" fill="#5F5E5A" text-anchor="middle">带声视频 · FOA/双耳 · 逐帧标签 · QA 对 · 全链 manifest</text>
</g>
