name: spear-env
# ============================================================================
# NOTE for collaborators: after `conda env create -f spear-env.yml`, you MUST
# also install two SPEAR-local editable packages that pip cannot fetch:
#
#     conda activate spear-env
#     cd <AVEngine>/external/SPEAR
#     pip install -e python       # spear-sim (Python SPEAR RPC client)
#     pip install -e python_ext   # spear-ext (compiled C++ extension; needs
#                                 #            SPEAR's cpp/ pre-built first;
#                                 #            see SPEAR docs)
# ============================================================================
channels:
  - defaults
dependencies:
  - python=3.11
  - pip:
