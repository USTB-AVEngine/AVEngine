# AVEngine Habitat-native bootstrap manifest.
# This file intentionally contains no SPEAR, UE, gpuRIR or generative-model
# dependency. Historical backends require the explicit legacy_optional profile.

schema: avengine_bootstrap_manifest_v2
version: 2
default_profile: habitat_native

repositories:
  avengine:
    role: primary_source_checkout
    path: .
  habitat_runtime:
    role: pinned_native_runtime_fork
    url: https://github.com/Eastforward/habitat-sim-AVEngine.git
    default_path: ../habitat-sim-AVEngine
    environment_override: AVENGINE_HABITAT_RUNTIME_ROOT
    commit: e9c81c10834f7e89f33f4e0602c75535a84e054b
    upstream_repository: https://github.com/facebookresearch/habitat-sim.git
    upstream_commit: 57ee4941dc4765240f0f91f70b2c97a919bf9038
    rlr_commit: 4fd446b4abb5c71fb7a232a083bbddd65f25fc6f
    install_by_default: false
    reason: native builds are a separate test layer; fast bootstrap only validates the checkout when present

python:
  requires: ">=3.10"
  native_reference: "3.12"
  default_environment: .venv
  editable_install: ".[test]"

profiles:
  habitat_native:
    default: true
    repositories: [avengine, habitat_runtime]
    automatic_backends: []
  legacy_optional:
    default: false
    explicit_opt_in_required: true
    documentation: docs/legacy/OPTIONAL_BACKENDS.md
    automatic_backends: []
    note: Historical UE, SPEAR, gpuRIR and generative-asset dependencies are never installed by the current setup script.

fast_checkout_contract:
  editable_install: true
  schema_validation: true
  fast_unit_tests: true
  native_runtime_build: false
  external_dataset_download: false
